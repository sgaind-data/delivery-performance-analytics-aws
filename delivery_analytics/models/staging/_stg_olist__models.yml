version: 2

models:
  - name: stg_olist__orders
    description: Orders with typed timestamps. One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']
      - name: order_purchased_at
        data_tests: [not_null]

  - name: stg_olist__order_items
    description: Order line items with typed price and freight. One row per order item.
    columns:
      - name: order_item_key
        description: Surrogate key = order_id + '-' + order_item_number.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: item_price
        data_tests: [not_null]
      - name: freight_value
        data_tests: [not_null]

  - name: stg_olist__customers
    description: One row per order-level customer_id.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: customer_state
        data_tests: [not_null]

  - name: stg_olist__sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: seller_state
        data_tests: [not_null]

  - name: stg_olist__products
    description: One row per product with typed dimensions.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_olist__order_payments
    description: One row per payment sequence per order.
    columns:
      - name: order_payment_key
        data_tests: [unique, not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: stg_olist__order_reviews
    description: Raw reviews with typed score and dates. Not unique per order (see intermediate layer).
    columns:
      - name: review_id
        data_tests: [not_null]
      - name: order_id
        data_tests: [not_null]
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__product_category_translation
    description: Portuguese to English category lookup.
    columns:
      - name: product_category_name
        data_tests: [unique, not_null]
