snapshots:
  - name: snap_sellers
    description: >
      SCD Type 2 history of sellers. When a seller's city, state or zip prefix changes,
      the old row is closed (dbt_valid_to is set) and a new current row is inserted.
    relation: ref('stg_olist__sellers')
    config:
      schema: snapshots
      unique_key: seller_id
      strategy: check
      check_cols: ['seller_zip_code_prefix', 'seller_city', 'seller_state']
